<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Go 棋谱合法性调试</title>
        <link rel="stylesheet"
            href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <h1>围棋棋谱调试</h1>
        <p id="color">当前棋手：</p>
        <section id="session-tools" aria-label="对局设置">
            <label for="player-black">黑棋</label>
            <select id="player-black">
                <option value="1" selected>人类</option>
                <option value="0">AI</option>
            </select>
            <label for="player-white">白棋</label>
            <select id="player-white">
                <option value="1" selected>人类</option>
                <option value="0">AI</option>
            </select>
            <label for="komi">贴目</label>
            <input id="komi" type="number" value="6.5" step="0.5">
            <button id="start-game" type="button">开始新对局</button>
            <span id="game-status" aria-live="polite">默认人类对弈；选择执棋方后可开始新对局。</span>
        </section>
        <section id="sgf-tools">
            <label for="sgf-file">选择 SGF 棋谱</label>
            <input id="sgf-file" type="file" accept=".sgf">
            <button id="load-sgf" type="button">载入棋谱</button>
            <button id="step-sgf" type="button" disabled>下一手</button>
            <label><input id="show-legal" type="checkbox">显示 Game 标记的合法点</label>
            <label><input id="show-num-eat" type="checkbox">显示 num_eat（黑/白）</label>
            <small>黑色数字 = num_eat[0]；红色数字 = num_eat[1]。</small>
            <span id="sgf-progress">尚未载入棋谱</span>
            <pre id="sgf-diagnostic" aria-live="polite"></pre>
        </section>
        <div id="game-container">
        <canvas id="go-board" width="600" height="600"></canvas>

        <div id="controls">
            <button id="pass-move" type="button">Pass</button>
            <button type="button">Reset</button>
            <button id="toggle-air">显示气数</button>
        </div>
        
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
